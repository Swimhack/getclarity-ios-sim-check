name: ios-pwa-ipa
on:
  workflow_dispatch:
    inputs:
      ipa: { default: 'no' }
jobs:
  safari-pwa:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Boot iPhone
        run: |
          mkdir -p out
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys,re;d=json.load(sys.stdin)['devices'];c=[(k,x) for k,v in d.items() if 'iOS' in k for x in v if re.match(r'iPhone \d+( Pro)?$',x['name'])];c.sort(key=lambda t:(tuple(int(n) for n in re.findall(r'\d+',t[0])),t[1]['name']));k,x=c[-1];print(x['udid']);open('out/device.txt','w').write(k+' '+x['name']+'\n')")
          echo "UDID=$UDID" >> $GITHUB_ENV; xcrun simctl boot $UDID; xcrun simctl bootstatus $UDID -b
      - name: Safari PWA checks
        continue-on-error: true
        timeout-minutes: 25
        run: |
          npm i -g appium >/dev/null 2>&1 && appium driver install xcuitest > out/appium_install.log 2>&1
          python3 -m venv /tmp/v && /tmp/v/bin/pip install -q Appium-Python-Client
          (appium --log out/appium.log &) ; sleep 10
          /tmp/v/bin/python scripts/pwa_safari.py 2>&1 | tee out/pwa_interact.log
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: pwa-results, path: out }
  ipa:
    if: github.event.inputs.ipa == 'yes'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned device IPA
        working-directory: native
        run: |
          npm ci && npx cap sync ios
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build MARKETING_VERSION=1.0.2 CURRENT_PROJECT_VERSION=3 CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > ../../xcb.log 2>&1 || (tail -60 ../../xcb.log; exit 1)
          APP=build/Build/Products/Release-iphoneos/App.app
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" -c "Print CFBundleVersion" -c "Print CFBundleIdentifier" $APP/Info.plist
          mkdir -p /tmp/ipa/Payload && cp -R $APP /tmp/ipa/Payload/ && (cd /tmp/ipa && zip -qry GetClarity-1.0.2-unsigned.ipa Payload) && shasum -a 256 /tmp/ipa/*.ipa
      - uses: actions/upload-artifact@v4
        with: { name: ipa-unsigned, path: /tmp/ipa/GetClarity-1.0.2-unsigned.ipa, retention-days: 1 }
